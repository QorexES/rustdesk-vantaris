import com.google.protobuf.gradle.*
import groovy.json.JsonSlurper

plugins {
    id "com.google.protobuf" version "0.9.4"
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Add rustls-platform-verifier Android support
String findRustlsPlatformVerifierMavenDir() {
    def dependencyText = providers.exec {
        it.workingDir = new File("../..")
        commandLine("cargo", "metadata", "--format-version", "1")
    }.standardOutput.asText.get()

    def dependencyJson = new JsonSlurper().parseText(dependencyText)
    def pkg = dependencyJson.packages.find { it.name == "rustls-platform-verifier-android" }
    
    if (pkg == null) {
        throw new GradleException("rustls-platform-verifier-android package not found in cargo metadata!")
    }
    
    def manifestPath = file(pkg.manifest_path)
    def mavenDir = new File(manifestPath.parentFile, "maven")
    
    if (!mavenDir.exists()) {
        throw new GradleException("Maven directory not found at: ${mavenDir.path}")
    }
    
    println("✓ Found rustls-platform-verifier maven repo at: ${mavenDir.path}")
    return mavenDir.path
}


repositories {
    maven {
        url = findRustlsPlatformVerifierMavenDir()
        metadataSources.artifact()
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.20.1'
    }

    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

// --- Vantaris ---
def vantarisAppId = System.getenv('VANTARIS_APP_ID') ?: 'es.vantaris.soporte'
def vantarisAppLabel = System.getenv('VANTARIS_APP_LABEL') ?: 'Vantaris Soporte'
// VANTARIS_PLAY=1: versión para Google Play (sin actualizador propio ni REQUEST_INSTALL_PACKAGES,
// avisos destacados antes de accesibilidad y captura). Ver client-build/play.md en RemoteControl.
def vantarisPlay = System.getenv('VANTARIS_PLAY') == '1'
def vantarisCustomClient = ''
def vantarisCustomFile = System.getenv('VANTARIS_CUSTOM_CLIENT_FILE')
if (vantarisCustomFile) {
    vantarisCustomClient = new File(vantarisCustomFile).getText('UTF-8').trim()
    // Es base64 firmado por RustDesk: solo caracteres seguros para un literal Java.
    assert vantarisCustomClient ==~ /[A-Za-z0-9+\/=]+/ : "VANTARIS_CUSTOM_CLIENT_FILE no parece una config de Pro"
}

android {
    namespace "com.carriez.flutter_hbb"
    compileSdkVersion 36
    // Vantaris: AGP 8 ya no genera BuildConfig por defecto (lo usa VANTARIS_CUSTOM_CLIENT)
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'

        main.proto.srcDirs += '../../../libs/base/protos'
        main.proto.includes += "message.proto"

        // Vantaris Play: manifiesto y textos que se superponen a los de main solo en release.
        if (vantarisPlay) {
            release.manifest.srcFile 'src/play/AndroidManifest.xml'
            release.res.srcDirs += 'src/play/res'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Vantaris: paquete, nombre y configuración firmada de Pro vienen de variables de entorno
        // (las pone client-build/build-vantaris.sh). Sin ellas: paquete de producción sin config embebida.
        applicationId vantarisAppId
        manifestPlaceholders = [appLabel: vantarisAppLabel]
        buildConfigField "String", "VANTARIS_CUSTOM_CLIENT", "\"${vantarisCustomClient}\""
        buildConfigField "boolean", "VANTARIS_PLAY", "${vantarisPlay}"
        if (vantarisPlay) {
            // flutter_webrtc trae también x86/x86_64, pero librustdesk.so y Flutter solo van en ARM:
            // sin filtro, Play daría a un x86_64 (Chromebook) una app que no arranca.
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
        minSdkVersion 22
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
      release {
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
        storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
        storePassword keystoreProperties['storePassword']
      }
    }

    buildTypes {
        release {
            // Vantaris: keystore propio si existe key.properties; si no, clave de depuración (solo pruebas).
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.protobuf:protobuf-javalite:3.20.1'
    implementation "androidx.media:media:1.6.0"
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation("org.jetbrains.kotlin:kotlin-stdlib") { version { strictly("1.9.10") } }
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation "rustls:rustls-platform-verifier:0.1.1"
}
